name: Promote WebGL Release Channel

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Release environment to promote (dev, staging, production)
        required: true
        default: staging
        type: choice
        options:
          - dev
          - staging
          - production
      build_id:
        description: Immutable build ID from builds/<build_id>
        required: true
        type: string
      deploy_prefix:
        description: Optional S3 key prefix override
        required: false
        type: string
      copy_to_channel_prefix:
        description: Copy build files to channels/<environment>/latest/
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  promote:
    name: Promote build to release channel
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      AWS_S3_PREFIX: ${{ vars.AWS_S3_PREFIX }}
      DEPLOY_PREFIX_OVERRIDE: ${{ github.event.inputs.deploy_prefix }}
      RELEASE_COPY_TO_CHANNEL: ${{ github.event.inputs.copy_to_channel_prefix }}
      TARGET_ENVIRONMENT: ${{ github.event.inputs.environment }}
      BUILD_ID: ${{ github.event.inputs.build_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC role)
        if: ${{ vars.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: ${{ vars.AWS_ROLE_TO_ASSUME == '' && secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS identity
        shell: bash
        run: |
          if [ -z "$AWS_S3_BUCKET" ]; then
            echo "::error::Repository variable AWS_S3_BUCKET is required."
            exit 1
          fi
          aws sts get-caller-identity >/dev/null

      - name: Promote selected build
        shell: bash
        run: ./.github/scripts/s3-release-manager.sh promote "$TARGET_ENVIRONMENT" "$BUILD_ID"
