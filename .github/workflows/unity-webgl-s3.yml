name: Unity WebGL Build and Release

on:
  push:
    branches:
      - main
      - dev
      - develop
      - staging
  workflow_dispatch:
    inputs:
      keep_builds:
        description: Number of build folders to keep in S3
        required: false
        type: string
      deploy_prefix:
        description: Optional S3 key prefix override
        required: false
        type: string
      target_environment:
        description: Promote build to environment after publish
        required: false
        type: choice
        default: none
        options:
          - none
          - dev
          - staging
          - production
      copy_to_channel:
        description: Copy promoted build into channels/<env>/latest
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: unity-webgl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-webgl:
    name: Build Unity WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Detect Unity editor version
        id: unity_version
        shell: bash
        run: |
          version="$(awk '/^m_EditorVersion:/{print $2}' ProjectSettings/ProjectVersion.txt)"
          if [ -z "$version" ]; then
            echo "::error::Unable to read Unity version from ProjectSettings/ProjectVersion.txt"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build WebGL player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: WebGL
          unityVersion: ${{ steps.unity_version.outputs.version }}
          buildName: ${{ vars.UNITY_WEBGL_BUILD_NAME || 'WebGLBuild' }}

      - name: Upload WebGL build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: build/WebGL
          if-no-files-found: error

  deploy-to-s3:
    name: Publish build and optionally promote
    runs-on: ubuntu-latest
    needs: build-webgl
    if: ${{ needs.build-webgl.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      AWS_S3_PREFIX: ${{ vars.AWS_S3_PREFIX }}
      AWS_S3_KEEP_BUILDS: ${{ vars.AWS_S3_KEEP_BUILDS || '10' }}
      AWS_RELEASE_ENVIRONMENTS: ${{ vars.AWS_RELEASE_ENVIRONMENTS || 'dev,staging,production' }}
      RELEASE_COPY_TO_CHANNEL: ${{ vars.AWS_RELEASE_COPY_TO_CHANNEL || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download WebGL build artifact
        uses: actions/download-artifact@v4
        with:
          name: webgl-build
          path: build/WebGL

      - name: Configure AWS credentials (OIDC role)
        if: ${{ vars.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: ${{ vars.AWS_ROLE_TO_ASSUME == '' && secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate deployment configuration
        shell: bash
        run: |
          if [ -z "$AWS_S3_BUCKET" ]; then
            echo "::error::Repository variable AWS_S3_BUCKET is required."
            exit 1
          fi
          aws sts get-caller-identity >/dev/null

      - name: Compute immutable build ID
        id: build_id
        shell: bash
        run: |
          BUILD_ID="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Publish immutable build and prune old versions
        shell: bash
        env:
          INPUT_KEEP_BUILDS: ${{ github.event.inputs.keep_builds }}
          INPUT_DEPLOY_PREFIX: ${{ github.event.inputs.deploy_prefix }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_KEEP_BUILDS:-}" ]; then
            export AWS_S3_KEEP_BUILDS="$INPUT_KEEP_BUILDS"
          fi
          if [ -n "${INPUT_DEPLOY_PREFIX:-}" ]; then
            export DEPLOY_PREFIX_OVERRIDE="$INPUT_DEPLOY_PREFIX"
          fi

          export BUILD_ID="${{ steps.build_id.outputs.build_id }}"
          bash .github/scripts/s3-release-manager.sh publish

      - name: Resolve promotion target
        id: promote_target
        shell: bash
        env:
          INPUT_TARGET_ENV: ${{ github.event.inputs.target_environment }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_TARGET_ENV:-}" ] && [ "$INPUT_TARGET_ENV" != "none" ]; then
            target="$INPUT_TARGET_ENV"
          else
            case "$GITHUB_REF" in
              refs/heads/dev|refs/heads/develop) target="dev" ;;
              refs/heads/staging) target="staging" ;;
              *) target="none" ;;
            esac
          fi

          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Promote build to release environment
        if: ${{ steps.promote_target.outputs.target != 'none' }}
        shell: bash
        env:
          INPUT_COPY_TO_CHANNEL: ${{ github.event.inputs.copy_to_channel }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_COPY_TO_CHANNEL:-}" ]; then
            export RELEASE_COPY_TO_CHANNEL="$INPUT_COPY_TO_CHANNEL"
          fi

          export TARGET_ENVIRONMENT="${{ steps.promote_target.outputs.target }}"
          export BUILD_ID="${{ steps.build_id.outputs.build_id }}"
          bash .github/scripts/s3-release-manager.sh promote
