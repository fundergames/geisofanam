name: Unity WebGL Build and Deploy to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      keep_builds:
        description: Number of build folders to keep in S3
        required: false
        type: string
      deploy_prefix:
        description: Optional S3 key prefix override
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: unity-webgl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-webgl:
    name: Build Unity WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Detect Unity editor version
        id: unity_version
        shell: bash
        run: |
          version="$(awk '/^m_EditorVersion:/{print $2}' ProjectSettings/ProjectVersion.txt)"
          if [ -z "$version" ]; then
            echo "::error::Unable to read Unity version from ProjectSettings/ProjectVersion.txt"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build WebGL player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: WebGL
          unityVersion: ${{ steps.unity_version.outputs.version }}
          buildName: GeisofanamWebGL

      - name: Upload WebGL build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: build/WebGL
          if-no-files-found: error

  deploy-to-s3:
    name: Deploy to S3 and prune old builds
    runs-on: ubuntu-latest
    needs: build-webgl
    if: ${{ needs.build-webgl.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      AWS_S3_PREFIX: ${{ vars.AWS_S3_PREFIX }}
      AWS_S3_KEEP_BUILDS: ${{ vars.AWS_S3_KEEP_BUILDS || '10' }}
    steps:
      - name: Download WebGL build artifact
        uses: actions/download-artifact@v4
        with:
          name: webgl-build
          path: build/WebGL

      - name: Configure AWS credentials (OIDC role)
        if: ${{ vars.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: ${{ vars.AWS_ROLE_TO_ASSUME == '' && secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate deployment configuration
        shell: bash
        run: |
          if [ -z "$AWS_S3_BUCKET" ]; then
            echo "::error::Repository variable AWS_S3_BUCKET is required."
            exit 1
          fi
          aws sts get-caller-identity >/dev/null

      - name: Publish build and prune old versions
        shell: bash
        env:
          INPUT_KEEP_BUILDS: ${{ github.event.inputs.keep_builds }}
          INPUT_DEPLOY_PREFIX: ${{ github.event.inputs.deploy_prefix }}
        run: |
          set -euo pipefail

          # Use workflow inputs when provided, otherwise fall back to repo variables.
          KEEP_BUILDS="${INPUT_KEEP_BUILDS:-$AWS_S3_KEEP_BUILDS}"
          DEPLOY_PREFIX="${INPUT_DEPLOY_PREFIX:-$AWS_S3_PREFIX}"

          if ! [[ "$KEEP_BUILDS" =~ ^[0-9]+$ ]]; then
            echo "::error::keep_builds must be a non-negative integer."
            exit 1
          fi

          DEPLOY_PREFIX="${DEPLOY_PREFIX#/}"
          DEPLOY_PREFIX="${DEPLOY_PREFIX%/}"

          if [ -n "$DEPLOY_PREFIX" ]; then
            ROOT_PREFIX="$DEPLOY_PREFIX/"
          else
            ROOT_PREFIX=""
          fi

          BUILD_ID="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          BUILD_PREFIX="${ROOT_PREFIX}builds/${BUILD_ID}"
          LATEST_PREFIX="${ROOT_PREFIX}latest"
          BUILDS_ROOT="${ROOT_PREFIX}builds/"

          aws s3 sync build/WebGL "s3://${AWS_S3_BUCKET}/${BUILD_PREFIX}/" --delete
          aws s3 sync build/WebGL "s3://${AWS_S3_BUCKET}/${LATEST_PREFIX}/" --delete

          metadata_file="$(mktemp)"
          printf '{\n  "buildId": "%s",\n  "commit": "%s",\n  "runUrl": "%s/%s/actions/runs/%s",\n  "publishedAt": "%s"\n}\n' \
            "$BUILD_ID" \
            "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_RUN_ID" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$metadata_file"
          aws s3 cp "$metadata_file" "s3://${AWS_S3_BUCKET}/${BUILD_PREFIX}/build-metadata.json"
          rm -f "$metadata_file"

          mapfile -t BUILD_PREFIXES < <(
            aws s3api list-objects-v2 \
              --bucket "$AWS_S3_BUCKET" \
              --prefix "$BUILDS_ROOT" \
              --delimiter "/" \
              --query 'CommonPrefixes[].Prefix' \
              --output text \
            | tr '\t' '\n' \
            | awk 'NF' \
            | sort
          )

          total="${#BUILD_PREFIXES[@]}"
          if [ "$total" -gt "$KEEP_BUILDS" ]; then
            to_delete=$((total - KEEP_BUILDS))
            for ((i=0; i<to_delete; i++)); do
              old_prefix="${BUILD_PREFIXES[$i]}"
              echo "Deleting old build prefix: ${old_prefix}"
              aws s3 rm "s3://${AWS_S3_BUCKET}/${old_prefix}" --recursive
            done
          fi

          echo "Published build: s3://${AWS_S3_BUCKET}/${BUILD_PREFIX}/"
          echo "Latest endpoint: s3://${AWS_S3_BUCKET}/${LATEST_PREFIX}/"
